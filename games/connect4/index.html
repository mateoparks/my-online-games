<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9f7ed">
  <title>Connect 4 | Arcade Current</title>
  <script src="../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../assets/site.css">
  <link rel="stylesheet" href="game.css">
</head>
<body class="game-page">
  <header class="site-header game-header">
    <a class="back" href="../../index.html">&larr; All games</a>
    <a class="brand" href="../../index.html">Arcade Current</a>
    <button class="theme-toggle" type="button" aria-label="Switch color theme">
      <span class="theme-icon" aria-hidden="true">☀</span>
      <span class="theme-icon" aria-hidden="true">☾</span>
      <span class="theme-thumb" aria-hidden="true"></span>
    </button>
  </header>
  <main>
    <p class="eyebrow">Drop, line up, win</p>
    <h1>Connect 4</h1>
    <p id="status"></p>
    <div id="board"></div>
    <div class="team-colors" role="group" aria-labelledby="checker-colors-title">
      <p id="checker-colors-title" class="team-colors-title">Checker colors</p>
      <label class="team-color" for="red-color">Red team <input id="red-color" data-checker="red" type="color" value="#d82e3f"></label>
      <label class="team-color" for="yellow-color">Yellow team <input id="yellow-color" data-checker="yellow" type="color" value="#e9a916"></label>
    </div>
    <p><button id="reset" class="primary-button">New game</button></p>
  </main>
  <script src="game.js"></script>
</body>
</html>
